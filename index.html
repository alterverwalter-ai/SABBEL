<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABBEL</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101114;
      color: #fff;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #1b1d22;
      border-radius: 20px;
      padding: 24px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin: 0 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #444;
      background: #111216;
      color: white;
    }

    button {
      border: 0;
      background: #2e8b57;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #353840;
    }

    #status {
      min-height: 24px;
      text-align: center;
      margin-top: 14px;
    }

    #chatScreen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .chatHeader {
      padding: 15px;
      background: #1b1d22;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chatHeader h2 {
      margin: 0;
    }

    .onlineDot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #28d17c;
      margin-right: 6px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #262930;
      padding: 10px 13px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 85%;
      word-break: break-word;
    }

    .mine {
      margin-left: auto;
      background: #246b47;
    }

    .sender {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 4px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1b1d22;
    }

    .composer input {
      margin: 0;
      flex: 1;
    }

    .composer button {
      margin: 0;
      width: auto;
    }

    #logoutBtn {
      width: auto;
      margin: 0;
      padding: 9px 12px;
      background: #444;
    }
  </style>
</head>

<body>

<div id="authScreen" class="screen">
  <div class="card">
    <h1>SABBEL</h1>
    <div class="subtitle">Dein privater Chat</div>

    <input id="email" type="email" placeholder="E-Mail-Adresse">
    <input id="password" type="password" placeholder="Passwort">
    <input id="username" type="text" placeholder="Anzeigename">

    <button onclick="registerUser()">Registrieren</button>
    <button class="secondary" onclick="loginUser()">Einloggen</button>

    <div id="status"></div>
  </div>
</div>

<div id="chatScreen">

  <div class="chatHeader">
    <div>
      <h2>SABBEL</h2>
      <small><span class="onlineDot"></span>verbunden</small>
    </div>

    <button id="logoutBtn" onclick="logoutUser()">Abmelden</button>
  </div>

  <div id="messages"></div>

  <div class="composer">
    <input id="messageInput"
           placeholder="Nachricht schreiben..."
           maxlength="2000">
    <button onclick="sendMessage()">Senden</button>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://oxrgkupnfsfaebexozjx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_voTXFRVZvqCL2zhSfBhWfg_uYrGlLLY";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let realtimeChannel = null;

const statusBox = document.getElementById("status");

function setStatus(text) {
  statusBox.textContent = text;
}

async function registerUser() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const username =
    document.getElementById("username").value.trim();

  if (!email || !password || !username) {
    setStatus("Bitte alle Felder ausfüllen.");
    return;
  }

  setStatus("Registrierung läuft...");

  const { data, error } =
    await sb.auth.signUp({
      email,
      password
    });

  if (error) {
    setStatus(error.message);
    return;
  }

  if (data.user && data.session) {

    const { error: profileError } =
      await sb
        .from("profiles")
        .insert({
          id: data.user.id,
          username: username,
          display_name: username
        });

    if (profileError) {
      setStatus(profileError.message);
      return;
    }
  }

  setStatus(
    "Registrierung erfolgreich. Prüfe ggf. deine E-Mails zur Bestätigung."
  );
}

async function loginUser() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    setStatus("E-Mail und Passwort eingeben.");
    return;
  }

  const { data, error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    setStatus(error.message);
    return;
  }

  currentUser = data.user;

  await ensureProfile();
  await openChat();
}

async function ensureProfile() {

  const { data } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  if (data) return;

  const username =
    document.getElementById("username").value.trim();

  if (!username) {
    setStatus(
      "Bitte Anzeigenamen eingeben und erneut einloggen."
    );
    await sb.auth.signOut();
    return;
  }

  const { error } =
    await sb
      .from("profiles")
      .insert({
        id: currentUser.id,
        username,
        display_name: username
      });

  if (error) {
    setStatus(error.message);
  }
}

async function openChat() {

  document.getElementById("authScreen").style.display =
    "none";

  document.getElementById("chatScreen").style.display =
    "flex";

  await loadMessages();
  startRealtime();
}

async function loadMessages() {

  const { data, error } =
    await sb
      .from("messages")
      .select(`
        id,
        message,
        created_at,
        sender_id,
        profiles:sender_id (
          display_name
        )
      `)
      .order("created_at", {
        ascending: true
      })
      .limit(200);

  if (error) {
    console.error(error);
    return;
  }

  const box =
    document.getElementById("messages");

  box.innerHTML = "";

  data.forEach(addMessage);

  box.scrollTop = box.scrollHeight;
}

function addMessage(row) {

  const box =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className = "message";

  if (
    currentUser &&
    row.sender_id === currentUser.id
  ) {
    div.classList.add("mine");
  }

  const sender =
    row.profiles?.display_name || "SABBEL-Nutzer";

  const senderDiv =
    document.createElement("div");

  senderDiv.className = "sender";
  senderDiv.textContent = sender;

  const textDiv =
    document.createElement("div");

  textDiv.textContent = row.message;

  div.appendChild(senderDiv);
  div.appendChild(textDiv);

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if (!message || !currentUser) return;

  const { error } =
    await sb
      .from("messages")
      .insert({
        sender_id: currentUser.id,
        message
      });

  if (error) {
    alert(error.message);
    return;
  }

  input.value = "";
}

function startRealtime() {

  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
  }

  realtimeChannel =
    sb
      .channel("sabbel-messages")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        async () => {

          await loadMessages();

          if (
            document.visibilityState !== "visible"
          ) {
            playNotification();
          }
        }
      )
      .subscribe();
}

function playNotification() {

  try {
    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.frequency.value = 650;
    gain.gain.value = 0.08;

    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
      ctx.close();
    }, 120);

  } catch (e) {}
}

async function logoutUser() {

  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  await sb.auth.signOut();

  currentUser = null;

  document.getElementById("chatScreen").style.display =
    "none";

  document.getElementById("authScreen").style.display =
    "flex";

  setStatus("");
}

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  );

async function restoreSession() {

  const { data } =
    await sb.auth.getSession();

  if (
    data.session &&
    data.session.user
  ) {
    currentUser =
      data.session.user;

    await openChat();
  }
}

restoreSession();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABBEL</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#101114; color:#fff; }
    .screen { min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
    .card { width:100%; max-width:480px; background:#1b1d22; border-radius:20px; padding:24px; }
    h1 { text-align:center; font-size:38px; margin:0 0 5px; }
    .subtitle { text-align:center; color:#aaa; margin-bottom:25px; }
    input,button { width:100%; padding:14px; margin-top:10px; border-radius:10px; font-size:16px; }
    input { border:1px solid #444; background:#111216; color:white; }
    button { border:0; background:#2e8b57; color:white; font-weight:bold; cursor:pointer; }
    button.register { background:#c93636; }
    button.login { background:#2e8b57; }
    #status { min-height:24px; text-align:center; margin-top:14px; color:#ddd; word-break:break-word; }
    #chatScreen { display:none; height:100vh; flex-direction:column; }
    .chatHeader { padding:15px; background:#1b1d22; display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
    .chatHeader h2 { margin:0; }
    .onlineDot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#e0a12b; margin-right:6px; }
    .onlineDot.connected { background:#28d17c; }
    .onlineDot.error { background:#e34f4f; }
    #messages { flex:1; overflow-y:auto; padding:15px; }
    .message { background:#262930; padding:10px 13px; border-radius:12px; margin-bottom:10px; max-width:85%; word-break:break-word; }
    .mine { margin-left:auto; background:#246b47; }
    .sender { font-size:12px; color:#bbb; margin-bottom:4px; }
    .time { font-size:10px; color:#aaa; margin-top:5px; text-align:right; }
    .composer { display:flex; gap:8px; padding:12px; background:#1b1d22; }
    .composer input { margin:0; flex:1; }
    .composer button { margin:0; width:auto; min-width:92px; }
    .composer button:disabled { opacity:.55; cursor:default; }
    .pending { opacity:.65; }
    .headerButtons { display:flex; gap:8px; margin-left:auto; }
    #deleteMyMessagesBtn,#logoutBtn { width:auto; margin:0; padding:9px 12px; }
    #deleteMyMessagesBtn { background:#b52f2f; }
    #logoutBtn { background:#444; }
    .confirmOverlay { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.78); }
    .confirmOverlay.show { display:flex; }
    .confirmBox { width:100%; max-width:430px; padding:28px 22px 22px; border:2px solid #555; border-radius:20px; background:#202228; box-shadow:0 12px 40px rgba(0,0,0,.55); }
    .confirmQuestion { margin:0 0 24px; color:#ffe100; font-size:24px; font-weight:bold; line-height:1.3; text-align:center; }
    .confirmButtons { display:flex; gap:14px; }
    .confirmButtons button { margin:0; color:#fff; }
    #confirmDeleteYes { background:#2e8b57; }
    #confirmDeleteNo { background:#c93636; }
  </style>
</head>
<body>
<div id="authScreen" class="screen">
  <div class="card">
    <h1>SABBEL</h1>
    <div class="subtitle">Melde dich an:</div>
    <input id="email" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
    <input id="password" type="password" placeholder="Passwort (Min. 8 Zeichen)" autocomplete="current-password" minlength="8">
    <input id="username" type="text" placeholder="Angezeigter Name" autocomplete="nickname">
    <button type="button" class="register" onclick="registerUser()">Registrieren</button>
    <button type="button" class="login" onclick="loginUser()">Einloggen</button>
    <div id="status"></div>
  </div>
</div>

<div id="chatScreen">
  <div class="chatHeader">
    <div><h2>SABBEL</h2><small><span id="connectionDot" class="onlineDot"></span><span id="connectionText">verbinde …</span></small></div>
    <div class="headerButtons">
      <button type="button" id="deleteMyMessagesBtn" onclick="showDeleteConfirmation()">Meine Nachrichten löschen</button>
      <button type="button" id="logoutBtn" onclick="logoutUser()">Abmelden</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="composer">
    <input id="messageInput" placeholder="Nachricht schreiben..." maxlength="2000">
    <button type="button" id="sendBtn" onclick="sendMessage()">Senden</button>
  </div>
</div>

<div id="deleteConfirmOverlay" class="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmQuestion">
  <div class="confirmBox">
    <p id="deleteConfirmQuestion" class="confirmQuestion">Wirklich alle deine Nachrichten löschen?</p>
    <div class="confirmButtons">
      <button type="button" id="confirmDeleteYes" onclick="confirmDeleteMyMessages()">Ja</button>
      <button type="button" id="confirmDeleteNo" onclick="hideDeleteConfirmation()">Nein</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://oxrgkupnfsfaebexozjx.supabase.co";
const SUPABASE_KEY="sb_publishable_voTXFRVZvqCL2zhSfBhWfg_uYrGlLLY";
let sb,currentUser=null,realtimeChannel=null,pollTimer=null,loadingMessages=false;
const renderedMessageIds=new Set();
const profileNames=new Map();
const statusBox=document.getElementById("status");
function setStatus(text){statusBox.textContent=text;}

try{
  if(!window.supabase) throw new Error("Supabase konnte nicht geladen werden. Internetverbindung prüfen.");
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}catch(error){console.error(error);setStatus("Startfehler: "+error.message);}

async function registerUser(){
 try{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const username=document.getElementById("username").value.trim();
  if(!email||!password||!username){setStatus("Bitte alle Felder ausfüllen.");return;}
  if(password.length<8){setStatus("Das Passwort muss mindestens 8 Zeichen haben.");return;}
  if(!/[A-ZÄÖÜ]/.test(password)||!/[a-zäöüß]/.test(password)||!/\d/.test(password)){
    setStatus("Das Passwort muß min. 1 Großbuchstabe, 1 Kleinbuchstabe und eine Zahl enthalten!");return;
  }
  if(!sb){setStatus("Supabase ist nicht verbunden.");return;}
  setStatus("Registrierung läuft...");
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username}}});
  if(error){
    if(/at least one character of each|uppercase|lowercase/i.test(error.message||"")){
      setStatus("Das Passwort muß min. 1 Großbuchstabe, 1 Kleinbuchstabe und eine Zahl enthalten!");
    }else setStatus("Fehler: "+error.message);
    return;
  }
  if(!data.user){setStatus("Registrierung fehlgeschlagen.");return;}
  if(!data.session){setStatus("Registrierung erfolgreich. Du kannst dich jetzt einloggen.");return;}
  currentUser=data.user;
  if(await ensureProfile(username))await openChat();
 }catch(error){console.error(error);setStatus("Registrierungsfehler: "+error.message);}
}

async function loginUser(){
 try{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){setStatus("E-Mail und Passwort eingeben.");return;}
  if(password.length<8){setStatus("Das Passwort muss mindestens 8 Zeichen haben.");return;}
  if(!sb){setStatus("Supabase ist nicht verbunden.");return;}
  setStatus("Anmeldung läuft...");
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){setStatus("Fehler: "+error.message);return;}
  if(!data.user){setStatus("Anmeldung fehlgeschlagen.");return;}
  currentUser=data.user;
  const username=document.getElementById("username").value.trim();
  if(await ensureProfile(username)) await openChat();
 }catch(error){console.error(error);setStatus("Anmeldefehler: "+error.message);}
}

async function ensureProfile(username=""){
 try{
  const {data,error}=await sb.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error){
    console.warn("Profil konnte nicht gelesen werden:",error);
    return true; // Der Chat selbst darf nicht an einer optionalen Profiltabelle scheitern.
  }
  if(data) return true;
  if(!username) username=document.getElementById("username").value.trim();
  if(!username){
    setStatus("Bitte Anzeigenamen eingeben und erneut einloggen.");
    await sb.auth.signOut(); currentUser=null; return false;
  }
  const {error:insertError}=await sb.from("profiles").insert({id:currentUser.id,username,display_name:username});
  if(insertError){setStatus("Profilfehler: "+insertError.message);return false;}
  return true;
 }catch(error){console.error(error);setStatus("Profilfehler: "+error.message);return false;}
}

async function openChat(){
 document.getElementById("authScreen").style.display="none";
 document.getElementById("chatScreen").style.display="flex";
 setConnection("connecting","verbinde …");
 await loadProfiles();
 await loadMessages();
 startRealtime();
 startPolling();
 document.getElementById("messageInput").focus();
}

async function loadMessages(){
 if(loadingMessages||!currentUser)return;
 loadingMessages=true;
 const box=document.getElementById("messages");
 try{
  const {data,error}=await sb.from("messages").select("id,message,created_at,sender_id").order("created_at",{ascending:true}).limit(200);
  if(error){
    if(!box.children.length)box.textContent="Nachrichten konnten nicht geladen werden: "+error.message;
    setConnection("error","Verbindung gestört"); return;
  }
  const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
  box.innerHTML=""; renderedMessageIds.clear();
  if(data)data.forEach(addMessage);
  if(wasNearBottom)box.scrollTop=box.scrollHeight;
 }finally{loadingMessages=false;}
}

function addMessage(row){
 if(row.id!=null&&renderedMessageIds.has(String(row.id)))return;
 if(row.id!=null)renderedMessageIds.add(String(row.id));
 const box=document.getElementById("messages"),div=document.createElement("div");
 div.className="message";
 if(row.id!=null)div.dataset.messageId=String(row.id);
 if(row.pending)div.classList.add("pending");
 if(currentUser&&row.sender_id===currentUser.id)div.classList.add("mine");
 const sender=document.createElement("div"); sender.className="sender";
 sender.textContent=row.sender_id===currentUser?.id?"Du":(profileNames.get(row.sender_id)||"Teilnehmer");
 const text=document.createElement("div"); text.textContent=row.message||"";
 const time=document.createElement("div"); time.className="time";
 if(row.created_at)time.textContent=new Date(row.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
 div.append(sender,text,time); box.appendChild(div); box.scrollTop=box.scrollHeight;
}

function removeMessage(row){
 if(!row||row.id==null)return;
 renderedMessageIds.delete(String(row.id));
 const item=document.querySelector('[data-message-id="'+CSS.escape(String(row.id))+'"]');
 if(item)item.remove();
}

async function sendMessage(){
 try{
  const input=document.getElementById("messageInput"),message=input.value.trim();
  if(!message)return;
  if(!currentUser){alert("Nicht angemeldet.");return;}
  const sendBtn=document.getElementById("sendBtn");
  sendBtn.disabled=true;
  input.disabled=true;
  addMessage({id:"local-"+Date.now(),sender_id:currentUser.id,message,created_at:new Date().toISOString(),pending:true});
  input.value="";
  const {error}=await sb.from("messages").insert({sender_id:currentUser.id,message});
  if(error){await loadMessages();alert("Nachricht konnte nicht gesendet werden: "+error.message);return;}
  await loadMessages();
  input.focus();
 }catch(error){alert("Sendefehler: "+error.message);}
 finally{
  document.getElementById("sendBtn").disabled=false;
  document.getElementById("messageInput").disabled=false;
 }
}

async function deleteMyMessages(){
 if(!currentUser){alert("Nicht angemeldet.");return;}
 const button=document.getElementById("deleteMyMessagesBtn");
 button.disabled=true;
 try{
  const {error}=await sb.from("messages").delete().eq("sender_id",currentUser.id);
  if(error){alert("Nachrichten konnten nicht gelöscht werden: "+error.message);return;}
  await loadMessages();
 }catch(error){alert("Löschfehler: "+error.message);}
 finally{button.disabled=false;}
}

function showDeleteConfirmation(){
 document.getElementById("deleteConfirmOverlay").classList.add("show");
 document.getElementById("confirmDeleteNo").focus();
}

function hideDeleteConfirmation(){
 document.getElementById("deleteConfirmOverlay").classList.remove("show");
 document.getElementById("deleteMyMessagesBtn").focus();
}

function confirmDeleteMyMessages(){
 hideDeleteConfirmation();
 deleteMyMessages();
}

function startRealtime(){
 if(realtimeChannel){sb.removeChannel(realtimeChannel);realtimeChannel=null;}
 realtimeChannel=sb.channel("sabbel-messages")
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},
  payload=>{addMessage(payload.new);playNotification(payload.new);})
 .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},
  payload=>removeMessage(payload.old))
 .subscribe(status=>{
   console.log("Realtime:",status);
   if(status==="SUBSCRIBED")setConnection("connected","verbunden");
   else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")setConnection("error","Verbindung gestört");
   else if(status==="CLOSED")setConnection("connecting","verbinde erneut …");
 });
}

function setConnection(state,text){
 const dot=document.getElementById("connectionDot");
 dot.className="onlineDot"+(state==="connected"?" connected":state==="error"?" error":"");
 document.getElementById("connectionText").textContent=text;
}

function startPolling(){
 if(pollTimer)clearInterval(pollTimer);
 // Fallback: Der Chat aktualisiert sich auch, wenn Realtime in Supabase nicht freigeschaltet ist.
 pollTimer=setInterval(()=>{if(!document.hidden&&currentUser)loadMessages();},4000);
}

async function loadProfiles(){
 try{
  const {data,error}=await sb.from("profiles").select("id,username,display_name");
  if(error)return;
  (data||[]).forEach(p=>profileNames.set(p.id,p.display_name||p.username||"Teilnehmer"));
 }catch(error){console.warn("Anzeigenamen nicht verfügbar:",error);}
}

function playNotification(row){
 if(currentUser&&row.sender_id===currentUser.id)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=650;
  gain.gain.setValueAtTime(.08,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);
  osc.start();osc.stop(ctx.currentTime+.12);
 }catch(error){console.log("Ton nicht möglich:",error);}
}

async function logoutUser(){
 try{
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(realtimeChannel){await sb.removeChannel(realtimeChannel);realtimeChannel=null;}
  await sb.auth.signOut();currentUser=null;
  document.getElementById("chatScreen").style.display="none";
  document.getElementById("authScreen").style.display="flex";
  document.getElementById("password").value="";
  setStatus("Abgemeldet.");
 }catch(error){setStatus("Abmeldefehler: "+error.message);}
}

document.getElementById("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&currentUser)loadMessages();
});

sb?.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"&&!session){currentUser=null;}
});

async function restoreSession(){
 if(!sb)return;
 try{
  const {data:{session},error}=await sb.auth.getSession();
  if(error){console.error(error);return;}
  if(session&&session.user){currentUser=session.user;await openChat();}
 }catch(error){console.error("Session:",error);}
}
restoreSession();
</script>
</body>
</html>
